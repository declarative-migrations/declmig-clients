name: atto-candidate-smoke

on:
  pull_request:
    paths:
      - "clients/atto/**"
      - "clients/rust/tests/atto_contract_surface.rs"
      - ".github/workflows/atto-candidate-smoke.yml"
  push:
    branches: [main]
    paths:
      - "clients/atto/**"
      - "clients/rust/tests/atto_contract_surface.rs"
      - ".github/workflows/atto-candidate-smoke.yml"

permissions:
  contents: read

jobs:
  candidate-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: atto-lang/atto-source.rs
          ref: d06f76c3c5567b66168365caed11150ed6c95a3d
          path: .deps/atto-source.rs
          persist-credentials: false
      - name: Rust counterpart tests
        run: cargo test --manifest-path clients/rust/Cargo.toml --all-targets
      - name: Compile AttoLang candidate and smoke assertions
        shell: bash
        run: |
          set -euo pipefail
          cat clients/atto/src/client.atto clients/atto/tests/smoke.atto > "$RUNNER_TEMP/declmig-atto-smoke.atto"
          cargo run --manifest-path .deps/atto-source.rs/Cargo.toml --bin attoc -- \
            "$RUNNER_TEMP/declmig-atto-smoke.atto" -o "$RUNNER_TEMP/declmig-atto-smoke.wasm"
          test -s "$RUNNER_TEMP/declmig-atto-smoke.wasm"
