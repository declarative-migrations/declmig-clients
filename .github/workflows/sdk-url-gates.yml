name: Rust and TypeScript SDK URL regression tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-url-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.1
          components: clippy
      - name: Test Rust SDK URL handling
        working-directory: clients/rust
        run: cargo test --all-targets
      - name: Lint Rust SDK
        working-directory: clients/rust
        run: cargo clippy --all-targets -- -D warnings

  typescript-url-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bundle TypeScript config with version-pinned esbuild
        run: |
          mkdir -p clients/typescript/dist
          npx --yes esbuild@0.25.12 clients/typescript/src/config.ts --bundle --platform=node --format=esm --outfile=clients/typescript/dist/config.mjs
      - name: Test TypeScript SDK URL handling
        run: node --test clients/typescript/test/config.test.mjs
