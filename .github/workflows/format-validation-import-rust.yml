name: format validation import Rust source

on:
  push:
    branches:
      - refactor/rust-validation-import-boundary-2026-09-11
    paths:
      - '.github/workflows/format-validation-import-rust.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: refactor/rust-validation-import-boundary-2026-09-11
          fetch-depth: 0

      - name: Install pinned Rust formatter
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Format and push only the Rust source
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path tools/validation-import-check/Cargo.toml --all
          git diff --check
          if git diff --quiet -- tools/validation-import-check/src/main.rs; then
            echo 'Rust source was already formatted'
            exit 0
          fi
          git config user.name 'ORESoftware automation'
          git config user.email 'automation@oresoftware.com'
          git add tools/validation-import-check/src/main.rs
          git commit -m 'style: rustfmt validation import checker'
          git push origin HEAD:refactor/rust-validation-import-boundary-2026-09-11
